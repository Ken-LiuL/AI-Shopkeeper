<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
    }
    .header {
      background: linear-gradient(135deg, #ff9500, #ff6a00);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 { font-size: 16px; }
    .header p { font-size: 11px; opacity: 0.85; }

    .tabs { display: flex; border-bottom: 2px solid #f0f0f0; }
    .tab {
      flex: 1; padding: 10px 0; text-align: center;
      font-size: 12px; cursor: pointer; color: #777;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
    }
    .tab.active { color: #ff6a00; border-bottom-color: #ff6a00; font-weight: 600; }

    .tab-panel { display: none; padding: 12px 14px; }
    .tab-panel.active { display: block; }

    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: #555; margin-bottom: 3px; }
    .field input, .field select {
      width: 100%; padding: 7px 9px;
      border: 1px solid #ddd; border-radius: 6px;
      font-size: 12px; outline: none;
    }
    .field input:focus, .field select:focus { border-color: #ff9500; }

    button.primary {
      width: 100%; padding: 9px;
      background: linear-gradient(135deg, #ff9500, #ff6a00);
      color: #fff; border: none; border-radius: 7px;
      font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px;
    }
    button.secondary {
      width: 100%; padding: 7px;
      background: #f5f5f5; color: #555;
      border: 1px solid #ddd; border-radius: 7px;
      font-size: 12px; cursor: pointer; margin-top: 6px;
    }
    button.secondary:hover { background: #eee; }
    button.danger {
      width: 100%; padding: 7px;
      background: #fff0f0; color: #e53935;
      border: 1px solid #ffcdd2; border-radius: 7px;
      font-size: 12px; cursor: pointer; margin-top: 6px;
    }

    .status { text-align: center; font-size: 11px; color: #4caf50; margin-top: 8px; min-height: 14px; }
    .status.error { color: #e53935; }

    /* 统计卡片 */
    .stat-row {
      display: flex; justify-content: space-between;
      padding: 5px 0; border-bottom: 1px solid #f0f0f0;
      font-size: 12px;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-name { color: #444; }
    .stat-ok { color: #4caf50; font-weight: 600; }
    .stat-err { color: #e53935; font-size: 11px; }

    /* Debug 日志 */
    .log-box {
      background: #1a1a1a; border-radius: 6px;
      padding: 8px; max-height: 200px; overflow-y: auto;
      font-family: monospace; font-size: 11px; line-height: 1.5;
      margin-top: 8px;
    }
    .log-entry { margin-bottom: 2px; }
    .log-time { color: #666; margin-right: 4px; }
    .log-info { color: #4fc3f7; }
    .log-success { color: #81c784; }
    .log-error { color: #ef9a9a; }

    .conn-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; margin-right: 4px;
    }
    .conn-ok { background: #4caf50; }
    .conn-err { background: #e53935; }
    .conn-unknown { background: #aaa; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>🤖 AI店长</h1>
      <p>美团数据同步 · 智能客服</p>
    </div>
    <div style="margin-left:auto;text-align:right;font-size:11px">
      <span class="conn-dot conn-unknown" id="connDot"></span>
      <span id="connStatus">未检测</span>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="sync">数据同步</div>
    <div class="tab" data-tab="debug">调试日志</div>
    <div class="tab" data-tab="cs">客服设置</div>
  </div>

  <!-- 数据同步 Tab -->
  <div class="tab-panel active" id="tab-sync">
    <div class="field">
      <label>后端服务器地址</label>
      <input type="url" id="syncApiBase" placeholder="http://192.144.227.205:8000">
    </div>
    <div class="field">
      <label>商户 ID</label>
      <input type="text" id="tenantId" placeholder="default">
    </div>
    <button class="primary" id="saveSyncSettings">保存并测试连接</button>
    <div class="status" id="syncSaveStatus"></div>

    <div style="margin-top:12px;font-size:11px;font-weight:600;color:#555;margin-bottom:6px">📊 同步统计</div>
    <div id="syncStatsList"><div style="color:#aaa;font-size:12px;text-align:center;padding:8px">尚无同步记录</div></div>

    <button class="secondary" id="forceSync">🔄 清除节流，立即同步</button>
    <div class="status" id="forceSyncStatus"></div>
  </div>

  <!-- 调试日志 Tab -->
  <div class="tab-panel" id="tab-debug">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span style="font-size:11px;font-weight:600;color:#555">实时日志</span>
      <button class="danger" id="clearLogs" style="width:auto;padding:3px 8px;font-size:11px;margin:0">清空</button>
    </div>
    <div class="log-box" id="logBox">
      <div style="color:#555">等待捕获数据...</div>
    </div>

    <div style="margin-top:10px">
      <button class="secondary" id="testConn">🔌 测试后端连接</button>
    </div>
    <div class="status" id="testConnStatus"></div>

    <div style="margin-top:8px;font-size:11px;color:#777;line-height:1.6">
      💡 打开 yiyao.meituan.com 并浏览订单/商品页面，数据会自动捕获并显示在此处。
    </div>
  </div>

  <!-- 客服设置 Tab -->
  <div class="tab-panel" id="tab-cs">
    <div class="field" style="display:flex;align-items:center;justify-content:space-between">
      <label style="margin:0">启用 AI 客服助手</label>
      <input type="checkbox" id="enabled" checked style="width:auto;accent-color:#ff6a00">
    </div>
    <div class="field">
      <label>回复模式</label>
      <select id="mode">
        <option value="auto-fill">自动填充（需手动发送）</option>
        <option value="auto-send">自动发送</option>
      </select>
    </div>
    <div class="field">
      <label>客服 API 地址（留空用默认）</label>
      <input type="url" id="apiUrl" placeholder="http://192.144.227.205:8000/api/v1/...">
    </div>
    <div class="field">
      <label>店铺 ID（可选）</label>
      <input type="text" id="storeId" placeholder="store_123">
    </div>
    <button class="primary" id="save">保存客服设置</button>
    <div class="status" id="csStatus"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
