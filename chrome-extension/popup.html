<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
    }
    .header {
      background: linear-gradient(135deg, #ff9500, #ff6a00);
      color: #fff;
      padding: 16px;
      text-align: center;
    }
    .header h1 { font-size: 18px; margin-bottom: 4px; }
    .header p { font-size: 12px; opacity: 0.85; }

    /* 标签页 */
    .tabs {
      display: flex;
      border-bottom: 2px solid #f0f0f0;
    }
    .tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
      color: #777;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab.active { color: #ff6a00; border-bottom-color: #ff6a00; font-weight: 600; }

    .tab-panel { display: none; padding: 14px 16px; }
    .tab-panel.active { display: block; }

    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .field input:focus, .field select:focus { border-color: #ff9500; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-row label { margin: 0; }

    button.primary {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #ff9500, #ff6a00);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    button.primary:hover { opacity: 0.9; }
    button.secondary {
      width: 100%;
      padding: 8px;
      background: #f5f5f5;
      color: #555;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
    }
    button.secondary:hover { background: #eee; }

    .status {
      text-align: center;
      font-size: 12px;
      color: #4caf50;
      margin-top: 10px;
      min-height: 16px;
    }

    /* 数据同步面板 */
    .sync-card {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .sync-card-title {
      font-weight: 600;
      font-size: 12px;
      color: #555;
      margin-bottom: 6px;
    }
    .sync-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid #eee;
      font-size: 12px;
    }
    .sync-item:last-child { border-bottom: none; }
    .sync-item-name { color: #444; }
    .sync-item-val { color: #888; font-size: 11px; }
    .sync-badge {
      display: inline-block;
      background: #ff9500;
      color: #fff;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
      margin-left: 6px;
    }
    .sync-empty { color: #aaa; font-size: 12px; text-align: center; padding: 10px 0; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 AI店长</h1>
    <p>牵牛花智能客服助手</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="cs">客服助手</div>
    <div class="tab" data-tab="sync">数据同步</div>
  </div>

  <!-- 客服助手 Tab -->
  <div class="tab-panel active" id="tab-cs">
    <div class="field toggle-row">
      <label>启用 AI 助手</label>
      <input type="checkbox" id="enabled" checked style="width:auto">
    </div>
    <div class="field">
      <label>回复模式</label>
      <select id="mode">
        <option value="auto-fill">自动填充（需手动发送）</option>
        <option value="auto-send">自动发送</option>
      </select>
    </div>
    <div class="field">
      <label>客服 API 地址</label>
      <input type="url" id="apiUrl" placeholder="https://ai-shopkeeper-1dl4.onrender.com/api/v1/customer-service/chat">
    </div>
    <div class="field">
      <label>API Key（可选）</label>
      <input type="password" id="apiKey" placeholder="Bearer token">
    </div>
    <div class="field">
      <label>店铺 ID（可选）</label>
      <input type="text" id="storeId" placeholder="store_123">
    </div>
    <button class="primary" id="save">保存设置</button>
    <div class="status" id="status"></div>
  </div>

  <!-- 数据同步 Tab -->
  <div class="tab-panel" id="tab-sync">
    <div class="field">
      <label>后端地址</label>
      <input type="url" id="syncApiBase" placeholder="https://ai-shopkeeper-kk.fly.dev">
    </div>
    <div class="field">
      <label>商户 ID（可选）</label>
      <input type="text" id="tenantId" placeholder="default">
    </div>
    <button class="primary" id="saveSyncSettings">保存同步配置</button>

    <div class="sync-card" style="margin-top: 14px;">
      <div class="sync-card-title">📊 同步状态</div>
      <div id="syncStatusList">
        <div class="sync-empty">尚未同步任何数据</div>
      </div>
    </div>

    <button class="secondary" id="forceSync">🔄 立即同步（清除节流限制）</button>
    <div class="status" id="syncStatus"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
