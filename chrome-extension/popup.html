<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
    }
    .header {
      background: linear-gradient(135deg, #ff9500, #ff6a00);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 { font-size: 16px; }
    .header p { font-size: 11px; opacity: 0.85; }

    .tabs { display: flex; border-bottom: 2px solid #f0f0f0; }
    .tab {
      flex: 1; padding: 10px 0; text-align: center;
      font-size: 12px; cursor: pointer; color: #777;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      transition: color 0.2s;
    }
    .tab:hover { color: #ff9500; }
    .tab.active { color: #ff6a00; border-bottom-color: #ff6a00; font-weight: 600; }

    .tab-panel { display: none; padding: 12px 14px; }
    .tab-panel.active { display: block; }

    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: #555; margin-bottom: 3px; }
    .field input, .field select {
      width: 100%; padding: 7px 9px;
      border: 1px solid #ddd; border-radius: 6px;
      font-size: 12px; outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus { border-color: #ff9500; }

    .mode-desc {
      font-size: 11px;
      color: #888;
      margin-top: 3px;
      padding-left: 2px;
      line-height: 1.4;
    }

    button.primary {
      width: 100%; padding: 9px;
      background: linear-gradient(135deg, #ff9500, #ff6a00);
      color: #fff; border: none; border-radius: 7px;
      font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px;
      transition: opacity 0.2s;
    }
    button.primary:hover { opacity: 0.9; }
    button.secondary {
      width: 100%; padding: 7px;
      background: #f5f5f5; color: #555;
      border: 1px solid #ddd; border-radius: 7px;
      font-size: 12px; cursor: pointer; margin-top: 6px;
      transition: background 0.2s;
    }
    button.secondary:hover { background: #eee; }
    button.danger {
      width: 100%; padding: 7px;
      background: #fff0f0; color: #e53935;
      border: 1px solid #ffcdd2; border-radius: 7px;
      font-size: 12px; cursor: pointer; margin-top: 6px;
    }
    button.danger:hover { background: #fce4ec; }

    .status { text-align: center; font-size: 11px; color: #4caf50; margin-top: 8px; min-height: 14px; }
    .status.error { color: #e53935; }

    /* Feedback Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: #f8f8f8;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #ff6a00;
    }
    .stat-value.green { color: #4caf50; }
    .stat-value.red { color: #e53935; }
    .stat-value.blue { color: #1976d2; }
    .stat-value.gray { color: #999; }
    .stat-label {
      font-size: 10px;
      color: #888;
      margin-top: 2px;
    }
    .stat-bar {
      margin-top: 10px;
      background: #f0f0f0;
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
      display: flex;
    }
    .stat-bar-seg {
      height: 100%;
      transition: width 0.3s;
    }
    .stat-bar-seg.adopted { background: #4caf50; }
    .stat-bar-seg.edited { background: #1976d2; }
    .stat-bar-seg.ignored { background: #e0e0e0; }
    .stat-legend {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      font-size: 10px;
      color: #888;
    }
    .stat-legend span::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      margin-right: 3px;
      vertical-align: middle;
    }
    .stat-legend .leg-adopted::before { background: #4caf50; }
    .stat-legend .leg-edited::before { background: #1976d2; }
    .stat-legend .leg-ignored::before { background: #e0e0e0; }

    /* Log */
    .log-box {
      background: #1a1a1a; border-radius: 6px;
      padding: 8px; max-height: 200px; overflow-y: auto;
      font-family: monospace; font-size: 11px; line-height: 1.5;
      margin-top: 8px;
    }
    .log-entry { margin-bottom: 2px; }
    .log-time { color: #666; margin-right: 4px; }
    .log-info { color: #4fc3f7; }
    .log-success { color: #81c784; }
    .log-error { color: #ef9a9a; }

    .conn-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; margin-right: 4px;
    }
    .conn-ok { background: #4caf50; }
    .conn-err { background: #e53935; }
    .conn-unknown { background: #aaa; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>🤖 AI店长</h1>
      <p>智能客服助手 v2.0</p>
    </div>
    <div style="margin-left:auto;text-align:right;font-size:11px">
      <span class="conn-dot conn-unknown" id="connDot"></span>
      <span id="connStatus">未检测</span>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="cs">客服设置</div>
    <div class="tab" data-tab="stats">反馈统计</div>
    <div class="tab" data-tab="debug">调试日志</div>
  </div>

  <!-- 客服设置 -->
  <div class="tab-panel active" id="tab-cs">
    <div class="field" style="display:flex;align-items:center;justify-content:space-between">
      <label style="margin:0">启用 AI 客服助手</label>
      <input type="checkbox" id="enabled" checked style="width:auto;accent-color:#ff6a00">
    </div>
    <div class="field">
      <label>回复模式</label>
      <select id="mode">
        <option value="suggest">💡 建议模式</option>
        <option value="auto-fill">✏️ 半自动模式</option>
        <option value="auto-send">🚀 全自动模式</option>
      </select>
      <div class="mode-desc" id="modeDesc">AI 生成建议，显示在面板，客服手动决定使用</div>
    </div>
    <div class="field">
      <label>客服 API 地址（留空用默认）</label>
      <input type="url" id="apiUrl" placeholder="http://192.144.227.205:8000/api/customer-service/chat">
    </div>
    <div class="field">
      <label>客服 API 基础地址</label>
      <input type="url" id="chatApiBase" placeholder="http://192.144.227.205:8000">
    </div>
    <div class="field">
      <label>店铺 ID（可选）</label>
      <input type="text" id="storeId" placeholder="store_123">
    </div>
    <button class="primary" id="save">保存客服设置</button>
    <button class="secondary" id="testConn">🔌 测试连接</button>
    <div class="status" id="csStatus"></div>
  </div>

  <!-- 反馈统计 -->
  <div class="tab-panel" id="tab-stats">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">总建议数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value green" id="statAdopted">0</div>
        <div class="stat-label">已采纳</div>
      </div>
      <div class="stat-card">
        <div class="stat-value blue" id="statEdited">0</div>
        <div class="stat-label">已编辑</div>
      </div>
      <div class="stat-card">
        <div class="stat-value gray" id="statIgnored">0</div>
        <div class="stat-label">已忽略</div>
      </div>
      <div class="stat-card">
        <div class="stat-value green" id="statGood">0</div>
        <div class="stat-label">👍 好评</div>
      </div>
      <div class="stat-card">
        <div class="stat-value red" id="statBad">0</div>
        <div class="stat-label">👎 差评</div>
      </div>
    </div>

    <div style="font-size:11px;font-weight:600;color:#555;margin-bottom:4px">采纳率分布</div>
    <div class="stat-bar" id="statBar">
      <div class="stat-bar-seg adopted" style="width:0%"></div>
      <div class="stat-bar-seg edited" style="width:0%"></div>
      <div class="stat-bar-seg ignored" style="width:0%"></div>
    </div>
    <div class="stat-legend">
      <span class="leg-adopted">采纳 <span id="statAdoptRate">0%</span></span>
      <span class="leg-edited">编辑 <span id="statEditRate">0%</span></span>
      <span class="leg-ignored">忽略 <span id="statIgnoreRate">0%</span></span>
    </div>

    <button class="danger" id="resetStats" style="margin-top:12px">🗑 重置统计</button>
  </div>

  <!-- 调试日志 -->
  <div class="tab-panel" id="tab-debug">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span style="font-size:11px;font-weight:600;color:#555">实时日志</span>
      <button class="danger" id="clearLogs" style="width:auto;padding:3px 8px;font-size:11px;margin:0">清空</button>
    </div>
    <div class="log-box" id="logBox">
      <div style="color:#555">暂无日志</div>
    </div>
    <div class="status" id="testConnStatus"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
