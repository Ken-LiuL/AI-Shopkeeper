<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
    }
    .header {
      background: linear-gradient(135deg, #ff9500, #ff6a00);
      color: #fff;
      padding: 16px;
      text-align: center;
    }
    .header h1 { font-size: 18px; margin-bottom: 4px; }
    .header p { font-size: 12px; opacity: 0.85; }
    .form { padding: 16px; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .field input:focus, .field select:focus { border-color: #ff9500; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-row label { margin: 0; }
    button.save {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #ff9500, #ff6a00);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    button.save:hover { opacity: 0.9; }
    .status {
      text-align: center;
      font-size: 12px;
      color: #4caf50;
      margin-top: 10px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 AI店长</h1>
    <p>牵牛花智能客服助手</p>
  </div>
  <div class="form">
    <div class="field toggle-row">
      <label>启用 AI 助手</label>
      <input type="checkbox" id="enabled" checked style="width:auto">
    </div>
    <div class="field">
      <label>回复模式</label>
      <select id="mode">
        <option value="auto-fill">自动填充（需手动发送）</option>
        <option value="auto-send">自动发送</option>
      </select>
    </div>
    <div class="field">
      <label>后台 API 地址</label>
      <input type="url" id="apiUrl" placeholder="https://ai-shopkeeper-1dl4.onrender.com/api/v1/customer-service/chat">
    </div>
    <div class="field">
      <label>API Key（可选）</label>
      <input type="password" id="apiKey" placeholder="Bearer token">
    </div>
    <div class="field">
      <label>店铺 ID（可选）</label>
      <input type="text" id="storeId" placeholder="store_123">
    </div>
    <button class="save" id="save">保存设置</button>
    <div class="status" id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
