<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI店长数据同步器 - 高级设置</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      height: auto;
      min-height: 100vh;
      padding: 20px;
    }

    .options-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .options-section {
      background: white;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .options-section h2 {
      font-size: 20px;
      margin-bottom: 16px;
      color: #495057;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .data-sources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
    }

    .source-config {
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 16px;
    }

    .source-config h4 {
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      margin-bottom: 8px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #667eea;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .interval-input {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .interval-input input {
      width: 80px;
    }

    .logs-container {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      background: #f8f9fa;
    }

    .log-entry {
      padding: 8px 12px;
      border-bottom: 1px solid #dee2e6;
      font-family: monospace;
      font-size: 12px;
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-entry.error {
      background: #f8d7da;
      color: #721c24;
    }

    .log-entry.success {
      background: #d4edda;
      color: #155724;
    }

    .log-entry.warning {
      background: #fff3cd;
      color: #856404;
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .form-grid,
      .data-sources-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AI店长数据同步器 - 高级设置</h1>
      <div class="status-indicator" id="connectionStatus">
        <span class="dot"></span>
        <span class="text">检查中...</span>
      </div>
    </header>

    <div class="options-container">
      <!-- 基本配置 -->
      <section class="options-section">
        <h2>基本配置</h2>
        <div class="form-grid">
          <div class="config-item">
            <label for="backendUrl">后端服务 URL</label>
            <input type="url" id="backendUrl" placeholder="https://ai-shopkeeper-kk.fly.dev">
          </div>
          <div class="config-item">
            <label for="apiKey">API 密钥</label>
            <input type="password" id="apiKey" placeholder="输入 API 密钥">
          </div>
          <div class="config-item">
            <label for="retryAttempts">重试次数</label>
            <input type="number" id="retryAttempts" min="1" max="10" value="3">
          </div>
          <div class="config-item">
            <label for="retryDelay">重试延迟 (秒)</label>
            <input type="number" id="retryDelay" min="1" max="60" value="5">
          </div>
        </div>
        <button type="button" class="btn btn-primary" id="saveBasicConfig">保存基本配置</button>
      </section>

      <!-- 数据源配置 -->
      <section class="options-section">
        <h2>数据源配置</h2>
        <p style="margin-bottom: 16px; color: #6c757d;">配置各数据源的同步频率和启用状态</p>
        <div class="data-sources-grid" id="dataSourcesGrid">
          <!-- 动态生成数据源配置 -->
        </div>
        <button type="button" class="btn btn-primary" id="saveDataSourceConfig">保存数据源配置</button>
      </section>

      <!-- 同步状态监控 -->
      <section class="options-section">
        <h2>同步状态监控</h2>
        <div style="margin-bottom: 16px;">
          <button type="button" class="btn btn-secondary" id="refreshStatus">刷新状态</button>
          <button type="button" class="btn btn-secondary" id="clearLogs">清除日志</button>
        </div>
        <div id="statusTable">
          <!-- 动态生成状态表格 -->
        </div>
      </section>

      <!-- 同步日志 -->
      <section class="options-section">
        <h2>同步日志</h2>
        <div class="logs-container" id="logsContainer">
          <div class="log-entry">正在加载日志...</div>
        </div>
      </section>

      <!-- 高级选项 -->
      <section class="options-section">
        <h2>高级选项</h2>
        <div class="form-grid">
          <div class="config-item">
            <label for="batchSize">批处理大小</label>
            <input type="number" id="batchSize" min="10" max="1000" value="50">
          </div>
          <div class="config-item">
            <label for="maxConcurrent">最大并发数</label>
            <input type="number" id="maxConcurrent" min="1" max="10" value="3">
          </div>
        </div>
        <div style="margin-top: 16px;">
          <button type="button" class="btn btn-secondary" id="resetConfig">重置所有配置</button>
          <button type="button" class="btn btn-secondary" id="exportConfig">导出配置</button>
          <button type="button" class="btn btn-secondary" id="importConfig">导入配置</button>
          <input type="file" id="importFile" accept=".json" style="display: none;">
        </div>
      </section>
    </div>

    <footer style="text-align: center; margin-top: 32px;">
      <div class="version">AI店长数据同步器 v1.0.0</div>
    </footer>
  </div>

  <!-- 消息提示 -->
  <div class="toast" id="toast">
    <span class="toast-message"></span>
    <button type="button" class="toast-close">&times;</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
