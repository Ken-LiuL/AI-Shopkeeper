<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI店长同步状态</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AI店长数据同步</h1>
      <div class="status-indicator" id="connectionStatus">
        <span class="dot"></span>
        <span class="text">检查中...</span>
      </div>
    </header>

    <main>
      <!-- 配置区域 -->
      <section class="config-section">
        <h3>配置</h3>
        <div class="config-item">
          <label for="backendUrl">后端 URL:</label>
          <input type="url" id="backendUrl" placeholder="https://ai-shopkeeper-kk.fly.dev">
        </div>
        <div class="config-item">
          <label for="apiKey">API Key:</label>
          <input type="password" id="apiKey" placeholder="输入 API Key">
          <button type="button" class="toggle-visibility" id="toggleApiKey">👁️</button>
        </div>
        <button type="button" class="btn btn-secondary" id="saveConfig">保存配置</button>
      </section>

      <!-- 快速操作 -->
      <section class="actions-section">
        <h3>快速操作</h3>
        <div class="action-buttons">
          <button type="button" class="btn btn-primary" id="syncAll">
            <span class="icon">🔄</span>
            同步所有数据
          </button>
          <button type="button" class="btn btn-secondary" id="testConnection">
            <span class="icon">🔗</span>
            测试连接
          </button>
        </div>
      </section>

      <!-- 数据源状态 -->
      <section class="sources-section">
        <h3>数据源状态</h3>
        <div class="sources-grid" id="sourcesGrid">
          <!-- 动态生成数据源卡片 -->
        </div>
      </section>

      <!-- 最近同步记录 -->
      <section class="recent-section">
        <h3>最近同步</h3>
        <div class="recent-logs" id="recentLogs">
          <div class="log-item placeholder">
            暂无同步记录
          </div>
        </div>
      </section>
    </main>

    <footer>
      <button type="button" class="btn btn-link" id="openOptions">
        <span class="icon">⚙️</span>
        高级设置
      </button>
      <div class="version">v1.0.0</div>
    </footer>
  </div>

  <!-- 加载遮罩 -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">处理中...</div>
  </div>

  <!-- 消息提示 -->
  <div class="toast" id="toast">
    <span class="toast-message"></span>
    <button type="button" class="toast-close">&times;</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
