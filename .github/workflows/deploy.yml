name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'src/**'
              - 'config/**'
              - 'migrations/**'
              - 'scripts/**'
              - 'data/**'
              - 'pyproject.toml'
              - 'requirements.backend.txt'
              - 'uv.lock'
              - 'Dockerfile'
              - 'Dockerfile.backend'
              - '.dockerignore'
              - 'docker-compose.yml'
              - '.github/workflows/deploy.yml'

  # ── 前端部署 → Vercel ──────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (Production)
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel env rm NEXT_PUBLIC_API_URL production --token $VERCEL_TOKEN --yes 2>/dev/null || true
          echo "${{ secrets.VPS_API_URL }}" | vercel env add NEXT_PUBLIC_API_URL production --token $VERCEL_TOKEN --yes 2>/dev/null || true
          vercel deploy --prod --token $VERCEL_TOKEN --yes

  # ── 后端部署 → VPS（推送模式，无需服务器访问 GitHub） ──────────────────
  deploy-backend:
    name: Deploy Backend (VPS)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          load: true
          platforms: linux/amd64
          tags: aishop-app:ci-${{ github.sha }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_rsa root@${{ secrets.VPS_HOST }} 'mkdir -p /opt/aishop'

      - name: Sync docker-compose.yml to VPS
        run: |
          scp -i ~/.ssh/id_rsa docker-compose.yml root@${{ secrets.VPS_HOST }}:/opt/aishop/docker-compose.yml

      - name: Upload backend image to VPS
        run: |
          docker save aishop-app:ci-${{ github.sha }} | gzip -1 > /tmp/aishop-app.tar.gz
          scp -i ~/.ssh/id_rsa /tmp/aishop-app.tar.gz root@${{ secrets.VPS_HOST }}:/opt/aishop/aishop-app.tar.gz

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 30s
          command_timeout: 40m
          script: |
            set -e
            IMAGE_TAG="${{ github.sha }}"

            echo "=== Loading backend image ==="
            gzip -dc /opt/aishop/aishop-app.tar.gz | docker load
            rm -f /opt/aishop/aishop-app.tar.gz
            docker tag "aishop-app:ci-${IMAGE_TAG}" aishop-app:latest
            echo "✅ Image ready"

            echo "=== Verifying built image ==="
            docker run --rm --entrypoint /bin/sh aishop-app:latest -lc '
              echo "--- /app/start.sh ---"
              nl -ba /app/start.sh | sed -n "1,80p"
              echo "--- python modules ---"
              python -c "import openpyxl, uvicorn; print(\"openpyxl\", openpyxl.__version__); print(\"uvicorn\", uvicorn.__version__)"
            '

            echo "=== Starting infra (no-recreate) ==="
            cd /opt/aishop
            docker compose up -d --no-recreate postgres neo4j redis 2>/dev/null || true

            echo "=== Restarting app only ==="
            docker rm -f aishop-app 2>/dev/null || true
            docker compose up -d --force-recreate --no-build app

            echo "=== Health check (up to 150s) ==="
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health >/dev/null; then
                echo "✅ Backend healthy"
                exit 0
              fi
              echo "Waiting for backend health... ($i/30)"
              sleep 5
            done
            echo "❌ Unhealthy"
            docker compose ps
            docker logs aishop-app --tail 100
            exit 1
