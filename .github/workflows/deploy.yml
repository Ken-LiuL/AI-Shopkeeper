name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── 前端部署 → Vercel ──────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (Production)
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel env rm NEXT_PUBLIC_API_URL production --token $VERCEL_TOKEN --yes 2>/dev/null || true
          echo "${{ secrets.VPS_API_URL }}" | vercel env add NEXT_PUBLIC_API_URL production --token $VERCEL_TOKEN --yes 2>/dev/null || true
          vercel deploy --prod --token $VERCEL_TOKEN --yes

  # ── 后端部署 → VPS（推送模式，无需服务器访问 GitHub） ──────────────────
  deploy-backend:
    name: Deploy Backend (VPS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Package & Push code to VPS
        run: |
          tar --exclude='.git' --exclude='node_modules' --exclude='__pycache__' \
              --exclude='*.pyc' --exclude='.next' \
              -czf /tmp/aishop-deploy.tar.gz .
          scp -i ~/.ssh/id_rsa /tmp/aishop-deploy.tar.gz root@${{ secrets.VPS_HOST }}:/opt/aishop/deploy.tar.gz

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 30s
          command_timeout: 20m
          script: |
            set -e
            echo "=== Extracting code ==="
            rm -rf /opt/aishop/repo
            mkdir -p /opt/aishop/repo
            tar -xzf /opt/aishop/deploy.tar.gz -C /opt/aishop/repo

            echo "=== Syncing docker-compose.yml ==="
            cp /opt/aishop/repo/docker-compose.yml /opt/aishop/docker-compose.yml

            echo "=== Building Docker image (with cache) ==="
            docker build --cache-from aishop-app:latest -t aishop-app:latest /opt/aishop/repo/
            echo "✅ Build done"

            echo "=== Starting infra (no-recreate) ==="
            cd /opt/aishop
            docker compose up -d --no-recreate postgres neo4j redis 2>/dev/null || true

            echo "=== Restarting app only ==="
            docker compose up -d --force-recreate --no-deps app

            echo "=== Health check (30s wait) ==="
            sleep 30
            curl -sf http://localhost:8000/health && echo "✅ Backend healthy" || \
              (echo "❌ Unhealthy" && docker logs aishop-app --tail 50 && exit 1)
