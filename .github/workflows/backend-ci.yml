name: Backend CI

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'Dockerfile', 'Dockerfile.backend']
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'Dockerfile', 'Dockerfile.backend']

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install linters
        run: pip install ruff

      - name: Ruff lint (ignore E402 delayed imports)
        run: ruff check src/ --ignore E402

      - name: Python syntax check (all src/)
        run: python -c "
          import ast, glob, sys
          errors = []
          for f in sorted(glob.glob('src/**/*.py', recursive=True)):
              try:
                  ast.parse(open(f).read())
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('Syntax errors found:')
              for e in errors:
                  print(f'  ❌ {e}')
              sys.exit(1)
          print(f'✅ All {len(glob.glob(\"src/**/*.py\", recursive=True))} files OK')
          "

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          load: true
          platforms: linux/amd64
          tags: aishop-app:ci-${{ github.sha }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
